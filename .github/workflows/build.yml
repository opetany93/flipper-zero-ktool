name: "FAP: Build"
# Builds the application into dist/ktool.fap on every push and PR, and once a
# day so that breakage from a new nightly or a new flipperzero-rs release shows
# up before it is needed.

on:
  push:
  pull_request:
  schedule:
    # do a build every day
    - cron: "1 1 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    name: "cargo: build ktool.fap"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        # Installs the channel and target pinned in rust-toolchain.toml.
        run: rustup show

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --release -- --deny warnings

      - name: Build
        run: cargo build --release

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: target/thumbv7em-none-eabihf/release/ktool.fap
