[toolchain]
# Nightly is required by the `different-binary-name` cargo feature, which is
# what lets the binary be emitted as `ktool.fap`.
channel = "nightly-2025-08-31"
targets = ["thumbv7em-none-eabihf"]
# Listed explicitly because CI runners default rustup to the `minimal` profile,
# which ships neither rustfmt nor clippy.
#
# `rust-analyzer` is here so VS Code uses the one matching this toolchain rather
# than the newer one bundled with the extension, which fails to expand macros -
# `write!` then looks like an empty function body and reports errors that
# `cargo` does not.
components = ["clippy", "rust-analyzer", "rustfmt"]
